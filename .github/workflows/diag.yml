name: Diagnose

# Reads before deciding: how every model id would be sourced, what a few models carry beyond their GLB
# (materials, textures by channel, visibility and material tracks, Arceus's material table) with
# diagnostic review rows, what the Unity path makes of Brilliant Diamond / Shining Pearl bundles, and
# the arenas as the game draws them. Everything lands on the m1-diag pre-release.
#
# Jobs that run third-party code (MEGA, 7z, converters, AssetStudio, FBX2glTF, Chrome) can only read the
# repo; only the last job, which runs nothing but gh on the artifacts, can write a release.
on:
  workflow_dispatch:
    inputs:
      models:
        description: Ids to convert with diagnostics (regex)
        default: '^(pikachu|snorlax|charizard|ponyta|nidoking|kingler|lucario)$'
      extra:
        description: Ids from a named game as well (space separated id@game, e.g. lucario@za)
        default: 'lucario@za'
      bdsp:
        description: BDSP model folders to try through the Unity path (space separated)
        default: 'pm0165_00_00 pm0165_00_01 pm0351_12_00'
      arenas:
        description: Build and draw the arenas too
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: diag
  cancel-in-progress: false

env:
  PME_REPO: https://github.com/GoldenCarrotMLP/PokeModelExporter.git
  PME_SHA: 84ec1e58c0fbb9a0dc7a2bf36b618e853ae2328a
  MEGA_CACHE: ${{ github.workspace }}/cache
  ASM_URL: https://github.com/aelurum/AssetStudio/releases/download/v0.19.0/AssetStudioModCLI_net9_linux64.zip
  FBX2GLTF_URL: https://github.com/godotengine/FBX2glTF/releases/download/v0.13.1/FBX2glTF-linux-x86_64.zip

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: pipeline
      - uses: actions/cache/restore@v4
        with:
          path: cache/cd
          key: mega-cd-${{ github.run_id }}
          restore-keys: mega-cd-
      - name: Plan every id
        run: |
          mkdir -p diag
          node pipeline/ids.mjs species/p1-ids.json work/ids.json
          node pipeline/plan.mjs work/ids.json work/plan.json --shards 16 --extra '${{ inputs.extra }}'
          node -e '
            const p = require("./work/plan.json");
            const rows = p.jobs.map((j) => [j.id, j.dex, j.ff, j.src ?? "-", j.folder ?? "-", j.shiny ? "shiny" : "", (j.entries ?? []).length, Math.round((j.entries ?? []).reduce((n, e) => n + e.csize, 0) / 1e3) + " KB", j.error ?? ""].join("\t"));
            require("fs").writeFileSync("diag/plan.tsv", rows.join("\n") + "\n");
          '
          cp work/ids.json diag/
      - uses: actions/cache/save@v4
        if: hashFiles('cache/.dirty') != ''
        with:
          path: cache/cd
          key: mega-cd-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: diag-plan
          path: |
            diag/
            work/plan.json

  models:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: pipeline
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: PokeModelExporter at a pinned commit
        run: |
          git init -q vendor/pme
          git -C vendor/pme fetch -q --depth 1 "$PME_REPO" "$PME_SHA"
          git -C vendor/pme checkout -q FETCH_HEAD
      - run: dotnet build conv/EggyConv.csproj -c Release -o work/conv --nologo -clp:ErrorsOnly
      - uses: actions/download-artifact@v4
        with:
          name: diag-plan
      - uses: actions/cache/restore@v4
        with:
          path: cache/cd
          key: mega-cd-${{ github.run_id }}
          restore-keys: mega-cd-
      - uses: actions/cache/restore@v4
        with:
          path: cache/entries
          key: mega-diag-${{ github.run_id }}
          restore-keys: mega-diag-
      - name: Fetch, convert with diagnostics, optimise, draw
        run: |
          rm -f cache/.dirty
          extra=$(echo '${{ inputs.extra }}' | xargs | sed 's/ /|/g')
          only='${{ inputs.models }}'
          if [ -n "$extra" ]; then only="$only|^($extra)\$"; fi
          node pipeline/fetch-entries.mjs work/plan.json work --only "$only"
          dotnet work/conv/eggyconv.dll work/jobs.json work/raw --debug work/debug --diag work/diag
          node pipeline/optimize.mjs work/raw out work/review
          RENDER_VARIANTS=1 node pipeline/render.mjs out work/review work/renders work/raw || true
          mkdir -p diag && cp work/renders/*.jpg work/raw/*.json work/diag/* diag/ 2>/dev/null || true
          ls diag | head -100
      - uses: actions/cache/save@v4
        if: always() && hashFiles('cache/.dirty') != ''
        with:
          path: cache/entries
          key: mega-diag-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-models
          path: diag/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: models-out
          path: out/

  bdsp:
    if: inputs.bdsp != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: pipeline
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - uses: actions/cache/restore@v4
        with:
          path: cache/bdsp
          key: bdsp-src-${{ github.run_id }}
          restore-keys: bdsp-src-
      - name: Fetch BDSP-Poke.7z from MEGA
        id: get
        run: |
          rm -f cache/bdsp/.dirty
          node pipeline/arenas/get.mjs BDSP-Poke.7z cache/bdsp
      - uses: actions/cache/save@v4
        if: always() && hashFiles('cache/bdsp/.dirty') != ''
        with:
          path: cache/bdsp
          key: bdsp-src-${{ github.run_id }}
      - name: The Unity path on the asked folders
        run: |
          mkdir -p diag tools
          a="${{ steps.get.outputs.file }}"
          curl -fsSL "$ASM_URL" -o tools/asm.zip && unzip -q tools/asm.zip -d tools/asm
          curl -fsSL "$FBX2GLTF_URL" -o tools/fbx.zip && unzip -q tools/fbx.zip -d tools/fbx
          cli=$(find tools/asm -type f -name AssetStudioModCLI | head -1)
          fbx=$(find tools/fbx -type f -name 'FBX2glTF-*' -not -name '*.txt' | head -1)
          chmod +x "$cli" "$fbx"
          pipeline/bdsp/extract.sh "$a" work/bdsp work/out "$cli" "$fbx" ${{ inputs.bdsp }}
          for g in $(find work/out -name '*.glb'); do node pipeline/bdsp/inspect.mjs "$g"; done > diag/bdsp-glb.txt 2>&1 || true
          grep -v '^      ' diag/bdsp-glb.txt | head -200
          for d in work/out/*/; do
            n=$(basename "$d")
            cp "$d/$n.glb" diag/ 2>/dev/null || true
            (cd "$d" && ls -la) > "diag/bdsp-files-$n.txt"
            for f in "$d"/*.log "$d"/*.json; do if [ -f "$f" ]; then cp "$f" "diag/bdsp-$n-$(basename "$f")"; fi; done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-bdsp
          path: diag/

  arenas:
    if: inputs.arenas
    needs: models
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: pipeline
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: PokeModelExporter at a pinned commit
        run: |
          git init -q vendor/pme
          git -C vendor/pme fetch -q --depth 1 "$PME_REPO" "$PME_SHA"
          git -C vendor/pme checkout -q FETCH_HEAD
      - run: dotnet build conv/EggyConv.csproj -c Release -o work/conv --nologo -clp:ErrorsOnly
      - uses: actions/cache/restore@v4
        with:
          path: cache/arenas
          key: arenas-src-${{ github.run_id }}
          restore-keys: arenas-src-
      - name: Fetch LGPE-BattleMaps.7z from MEGA
        id: get
        run: |
          rm -f cache/arenas/.dirty
          node pipeline/arenas/get.mjs LGPE-BattleMaps.7z cache/arenas
      - uses: actions/cache/save@v4
        if: always() && hashFiles('cache/arenas/.dirty') != ''
        with:
          path: cache/arenas
          key: arenas-src-${{ github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          name: models-out
          path: work/pkmn
      - name: Convert, optimise, draw
        run: |
          7z t "${{ steps.get.outputs.file }}" | tail -2
          7z x -y -bd -owork/src "${{ steps.get.outputs.file }}" > /dev/null
          dotnet work/conv/eggyconv.dll --arenas work/src/background work/raw pipeline/arenas/b0.json
          node pipeline/arenas/optimize.mjs work/raw arenas pipeline/arenas/b0.json
          node pipeline/arenas/render.mjs arenas work/renders work/pkmn || true
          mkdir -p diag
          for f in work/renders/*.jpg; do cp "$f" "diag/arena-$(basename "$f")"; done
          cp work/renders/checks.json diag/arena-checks.json || true
          for f in work/raw/*.json; do cp "$f" "diag/arena-report-$(basename "$f")"; done
          cp arenas/arenas.json diag/arena-arenas.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-arenas
          path: diag/

  publish:
    needs: [plan, models, bdsp, arenas]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
          pattern: diag-*
      - name: Put everything on the m1-diag pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p pub
          find art -type f -not -name 'plan.json' -exec cp --update=none {} pub/ \;
          if [ -f art/diag-plan/work/plan.json ]; then gzip -c art/diag-plan/work/plan.json > pub/plan.json.gz; fi
          (cd pub && sha256sum * > SHA256SUMS)
          ls pub | wc -l
          gh release view m1-diag >/dev/null 2>&1 || gh release create m1-diag --prerelease --title "m1 diagnostics" --notes "What the sources hold, read before deciding how to convert them."
          for a in $(gh release view m1-diag --json assets -q '.assets[].name'); do gh release delete-asset m1-diag "$a" -y; done
          gh release upload m1-diag pub/* --clobber
